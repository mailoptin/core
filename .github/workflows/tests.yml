name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wptests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, json, openssl, sodium
          coverage: none

      - name: Install the plugin's dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Install the WordPress test library
        run: |
          mkdir -p "$RUNNER_TEMP/wptest"
          cd "$RUNNER_TEMP/wptest"
          cat > composer.json <<'JSON'
          {
            "require-dev": {
              "wp-phpunit/wp-phpunit": "6.6.*",
              "johnpbloch/wordpress-core": "6.6.*",
              "yoast/phpunit-polyfills": "^1.1",
              "phpunit/phpunit": "^9.6"
            },
            "config": {"allow-plugins": {"johnpbloch/wordpress-core-installer": true}}
          }
          JSON
          composer update --no-interaction --no-progress --prefer-dist
          cat > wp-tests-config.php <<PHP
          <?php
          define('ABSPATH', '$RUNNER_TEMP/wptest/vendor/johnpbloch/wordpress-core/');
          define('WP_DEFAULT_THEME', 'default');
          define('WP_DEBUG', true);
          define('DB_NAME', 'wptests');
          define('DB_USER', 'root');
          define('DB_PASSWORD', 'root');
          define('DB_HOST', '127.0.0.1');
          define('DB_CHARSET', 'utf8mb4');
          define('DB_COLLATE', '');
          \$table_prefix = 'wptests_';
          define('WP_TESTS_DOMAIN', 'example.org');
          define('WP_TESTS_EMAIL', 'admin@example.org');
          define('WP_TESTS_TITLE', 'Test Blog');
          define('WP_PHP_BINARY', 'php');
          define('WPLANG', '');
          PHP

      # The suites the list-management releases added. tests/Admin and the older Connections,
      # Repositories and Triggers tests fail on master already; mailoptin/core#105 repairs the
      # older ones, after which they belong in this list.
      - name: PHPUnit
        env:
          WP_TESTS_DIR: ${{ runner.temp }}/wptest/vendor/wp-phpunit/wp-phpunit
          WP_PHPUNIT__TESTS_CONFIG: ${{ runner.temp }}/wptest/wp-tests-config.php
          WP_TESTS_PHPUNIT_POLYFILLS_PATH: ${{ runner.temp }}/wptest/vendor/yoast/phpunit-polyfills
        run: |
          status=0
          for suite in tests/SendQueue tests/Audience tests/Submissions tests/Repositories/CampaignSettingsStorageTest.php tests/Design tests/Api tests/Automations tests/EmailBlocks; do
            echo "::group::$suite"
            "$RUNNER_TEMP/wptest/vendor/bin/phpunit" --no-configuration --bootstrap tests/bootstrap.php "$suite" || status=1
            echo "::endgroup::"
          done
          exit $status
